<meta charset="utf-8">

<title>BP 리포트 허브 — 화면 기획 프로토 v1</title>
<style>
:root{
  --bg:#f6f6f7; --card:#ffffff; --ink:#1b1b20; --sub:#6b6b74; --faint:#a3a3ad;
  --line:#e6e6ea; --line2:#d6d6dc;
  --acc:#d6366f; --acc-bg:#fdf0f5; --acc-line:#f5c8da;
  --blue:#0e7490; --blue-bg:#effafc; --blue-line:#bfe6ee;
  --amber:#b45309; --amber-bg:#fff8ec; --amber-line:#f2ddb8;
  --ok:#15803d; --ok-bg:#f0fdf4; --warn:#b45309; --warn-bg:#fffbeb;
  --shadow:0 1px 3px rgba(20,20,30,.06);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131316; --card:#1c1c21; --ink:#ececf0; --sub:#9c9ca6; --faint:#6a6a74;
  --line:#2a2a31; --line2:#38383f;
  --acc:#f06a9b; --acc-bg:#2b1a22; --acc-line:#57303f;
  --blue:#4fb3cb; --blue-bg:#152a30; --blue-line:#2a4d57;
  --amber:#e0a050; --amber-bg:#2b2418; --amber-line:#57462a;
  --ok:#4ade80; --ok-bg:#14261a; --warn:#e0a050; --warn-bg:#2b2418;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#131316; --card:#1c1c21; --ink:#ececf0; --sub:#9c9ca6; --faint:#6a6a74;
  --line:#2a2a31; --line2:#38383f;
  --acc:#f06a9b; --acc-bg:#2b1a22; --acc-line:#57303f;
  --blue:#4fb3cb; --blue-bg:#152a30; --blue-line:#2a4d57;
  --amber:#e0a050; --amber-bg:#2b2418; --amber-line:#57462a;
  --ok:#4ade80; --ok-bg:#14261a; --warn:#e0a050; --warn-bg:#2b2418;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#f6f6f7; --card:#ffffff; --ink:#1b1b20; --sub:#6b6b74; --faint:#a3a3ad;
  --line:#e6e6ea; --line2:#d6d6dc;
  --acc:#d6366f; --acc-bg:#fdf0f5; --acc-line:#f5c8da;
  --blue:#0e7490; --blue-bg:#effafc; --blue-line:#bfe6ee;
  --amber:#b45309; --amber-bg:#fff8ec; --amber-line:#f2ddb8;
  --ok:#15803d; --ok-bg:#f0fdf4; --warn:#b45309; --warn-bg:#fffbeb;
  --shadow:0 1px 3px rgba(20,20,30,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* 앱 셸 */
.topbar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 22px;height:52px}
.topbar .logo{font-weight:800;letter-spacing:-.01em;font-size:15px}
.topbar .logo em{color:var(--acc);font-style:normal}
.topbar nav{display:flex;gap:2px;font-size:13px;color:var(--sub)}
.topbar nav span{padding:5px 10px;border-radius:7px}
.topbar nav span.on{background:var(--acc-bg);color:var(--acc);font-weight:700}
.topbar .who{margin-left:auto;font-size:12px;color:var(--faint)}
.crumb{max-width:1060px;margin:18px auto 0;padding:0 22px;font-size:12.5px;color:var(--sub);display:flex;gap:8px;align-items:center}
.crumb b{color:var(--ink)}
.crumb button{color:var(--acc);font-weight:700;font-size:12.5px}
.wrap{max-width:1060px;margin:0 auto;padding:14px 22px 90px}
.note-proto{max-width:1060px;margin:10px auto 0;padding:0 22px;font-size:11.5px;color:var(--faint)}

/* 홈 */
.home-head{margin:26px 0 6px}
.home-head h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.home-head p{margin:6px 0 0;color:var(--sub);max-width:560px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.menu .m{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;
  text-align:left;box-shadow:var(--shadow);transition:border-color .15s}
.menu .m:hover{border-color:var(--acc)}
.menu .m .k{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.menu .m h2{margin:6px 0 4px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.menu .m p{margin:0;color:var(--sub);font-size:13px}
.menu .m .meta{margin-top:14px;font-size:12px;color:var(--faint)}
.menu .m.hero{grid-column:1 / -1;border:1px solid var(--acc-line);background:linear-gradient(0deg,var(--acc-bg),var(--card))}
.menu .m.hero h2{color:var(--acc);font-size:19px}

/* 공용 카드/칩 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.panel h3{margin:0 0 4px;font-size:15px;font-weight:800}
.panel .q{font-size:12.5px;color:var(--sub);margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);border-radius:99px;padding:6px 14px;font-size:13px;background:var(--card)}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.chip.dis{opacity:.45;cursor:not-allowed}
.chip .n{font-size:11px;opacity:.75;margin-left:5px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;vertical-align:1px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.mut{background:var(--bg);color:var(--faint)}

/* 옵션 카드(스코프/렌즈) */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;background:var(--card);transition:border-color .15s}
.opt:hover{border-color:var(--acc)}
.opt.on{border-color:var(--acc);background:var(--acc-bg)}
.opt h4{margin:0 0 2px;font-size:14px;font-weight:800}
.opt p{margin:0;font-size:12px;color:var(--sub)}
.opt .ex{margin-top:8px;font-size:11.5px;color:var(--faint)}
.opt.lens-c.on{border-color:var(--acc);background:var(--acc-bg)}
.opt.lens-i.on{border-color:var(--blue);background:var(--blue-bg)}
.opt.lens-s.on{border-color:var(--amber);background:var(--amber-bg)}
.lens-mark{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}
.lens-c .lens-mark{background:var(--acc)} .lens-i .lens-mark{background:var(--blue)} .lens-s .lens-mark{background:var(--amber)}
.sections{margin:8px 0 0;padding:0 0 0 2px;list-style:none;font-size:12px;color:var(--sub)}
.sections li{padding:2px 0;border-bottom:1px dashed var(--line)}
.sections li:last-child{border-bottom:0}
.sections li b{color:var(--ink)}

/* 문장 빌더 바 */
.sentence{position:sticky;top:52px;z-index:9;background:var(--card);border:1px solid var(--acc-line);
  border-radius:12px;margin:14px 0;padding:13px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.sentence .s-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);flex:none;text-transform:uppercase}
.sentence .s-text{font-size:15px;font-weight:700;letter-spacing:-.01em;min-height:1.4em}
.sentence .s-text .slot{color:var(--faint);font-weight:500}
.sentence .s-text .fill{color:var(--acc)}
.sentence .s-text .fill.b{color:var(--blue)} .sentence .s-text .fill.a{color:var(--amber)}

/* 스텝 */
.steps{display:flex;gap:6px;margin:6px 0 14px;font-size:12px;color:var(--faint)}
.steps span{padding:4px 10px;border-radius:7px;background:var(--card);border:1px solid var(--line)}
.steps span.done{color:var(--ok);border-color:var(--ok-bg)}
.steps span.now{color:var(--acc);border-color:var(--acc-line);background:var(--acc-bg);font-weight:700}
.actions{display:flex;gap:10px;margin-top:16px;align-items:center}
.btn{border-radius:9px;padding:9px 20px;font-size:13.5px;font-weight:700;border:1px solid var(--line2)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{color:var(--sub)}
.hint{font-size:12px;color:var(--faint)}

/* 요약/생성 */
.recipe{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:13.5px;margin:8px 0 4px}
.recipe dt{color:var(--sub);font-size:12.5px}
.recipe dd{margin:0;font-weight:600}
.cost{display:flex;gap:10px;margin-top:14px}
.cost .c{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cost .c .v{font-weight:800;font-size:16px}
.cost .c .k{font-size:11.5px;color:var(--sub)}
.gen{margin-top:16px;padding:16px;border:1px dashed var(--line2);border-radius:12px;font-size:13px;color:var(--sub)}
.gen .bar{height:6px;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:10px 0 6px}
.gen .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .5s}
.callout{border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:0 9px 9px 0;padding:10px 14px;font-size:12.5px;color:var(--sub);margin-top:12px}

/* 목록 테이블 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
thead th{font-size:11px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
tbody tr:hover{background:var(--bg)}
td.num{font-variant-numeric:tabular-nums}
.rowbtn{color:var(--acc);font-weight:700;font-size:12.5px}

/* 위저드 */
.wiz-step{display:flex;gap:14px;margin-top:6px}
.wiz-step .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acc);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.wiz-step .no.off{background:var(--bg);color:var(--faint);border:1px solid var(--line)}
.wiz-step .body{flex:1;padding-bottom:18px;border-left:1px dashed var(--line);margin-left:-27px;padding-left:41px}
.wiz-step h4{margin:2px 0 4px;font-size:14px;font-weight:800}
.wiz-step p{margin:0;font-size:12.5px;color:var(--sub)}
.filelist{margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.filelist span{border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--bg)}
.filelist b{font-weight:700}
@media (max-width:680px){.menu{grid-template-columns:1fr}.sentence{flex-direction:column;align-items:flex-start;gap:4px}}
</style>

<div class="topbar">

<script>
/* ---------- 픽스처 (실제 적재 데이터 기준) ---------- */
const BRANDS = [
  {n:"Kundal", c:"US", cat:"헤어케어", vids:3158, loaded:true},
  {n:"EQQUALBERRY", c:"US", cat:"스킨케어", vids:8402, loaded:true},

  {n:"Summer Fridays", c:"US", cat:"립·스킨케어", vids:5200, loaded:true},
  {n:"TOSOWOONG", c:"US", cat:"스킨케어", vids:7100, loaded:true},
  {n:"Dalba", c:"US", cat:"스킨케어", vids:4400, loaded:true},
  {n:"Dr. Groot", c:"US", cat:"헤어케어", vids:3600, loaded:true},
  {n:"Dr. Reju-all", c:"US", cat:"스킨케어", vids:1900, loaded:true},
  {n:"skin1004", c:"US", cat:"스킨케어", vids:2800, loaded:true},
  {n:"Kundal", c:"GB", cat:"헤어케어", vids:2600, loaded:true},
  {n:"Dr. Althea", c:"GB", cat:"스킨케어", vids:3475, loaded:true},
  {n:"Beauty of Joseon", c:"GB", cat:"스킨케어", vids:9943, loaded:true},
  {n:"아직 없는 브랜드", c:"US", cat:"—", vids:0, loaded:false},
];
const CATS = ["스킨케어","헤어케어","립","바디·스킨케어"];
const REPORTS = [
  {t:"미국 뷰티 14개 브랜드의 2025 블랙프라이데이 플레이가 궁금해요", scope:"카테고리 경향", lens:"시즈널리티", d:"2026-07-28", by:"상희", status:"완료"},
  {t:"영국에서 Beauty of Joseon과 Dr. Althea의 인플루언서 전략이 궁금해요", scope:"브랜드 비교", lens:"인플루언서 전략", d:"2026-07-15", by:"상희", status:"완료"},
  {t:"이퀄베리·메디테라피의 프라임데이 전후 움직임이 궁금해요", scope:"브랜드 비교", lens:"시즈널리티", d:"2026-07-20", by:"상희", status:"완료"},
];
const LENSES = {
  content:{key:"content", cls:"lens-c", fill:"", name:"콘텐츠를 자세히 확인하고 싶어요",
    ans:["어떤 내러티브(이야기 유형)가 반응을 얻고, 어떤 게 파는가","반복되는 키 메시지와 근거 영상","반응 1위와 매출 1위가 다른 지점"],
    secs:["내러티브별 성과 병치 (편수·반응률·매출·GPM)","키 메시지 3~5개 + 근거 영상","월별 추이와 변곡점 Top 영상","광고 집행 콘텐츠의 특징"]},
  influencer:{key:"influencer", cls:"lens-i", fill:"b", name:"인플루언서 마케팅 전략이 궁금해요",
    ans:["티어 구성과 물량 운영 패턴","스파크애즈를 어떤 영상에 얼마나 태우는가","반복 기용 크리에이터와 성과 상위 계정"],
    secs:["운용 패턴 요약 (월 물량·티어 비중·광고 집행 비중)","월별 물량 × 매출 반응 차트","성과 대표 영상 (임베드 + 6지표)","운영 공식 정리"]},
  seasonality:{key:"seasonality", cls:"lens-s", fill:"a", name:"시즈널리티 마케팅 방식이 궁금해요",
    ans:["이벤트(블프·프라임데이 등) 전·중·후에 무엇이 움직였나","언제부터 램프업하고 얼마나 유지하는가","딜과 시딩이 어떻게 맞물렸나"],
    secs:["이벤트 윈도우 전·중·후 분해","주간 물량 티어 스택 × 순위 반응","승자·반례 비교","다음 시즌 운영 공식"]},
};
const SCOPES = {
  single:{name:"브랜드 하나", sent:b=>`${b[0]||"___"}의`, ex:"예: Kahi가 궁금해요", pick:"브랜드 1개 선택", max:1},
  compare:{name:"브랜드 비교", sent:b=>b.length>1?`${b.slice(0,-1).join(", ")}와 ${b[b.length-1]}를 비교해`:`${b[0]||"___"}와 ___를 비교해`, ex:"예: 이 브랜드끼리 비교했으면 좋겠어요", pick:"브랜드 2~5개 선택", max:5},
  country:{name:"국가 전체 트렌드", sent:()=>"전체 브랜드 풀에서", ex:"예: 미국 전체 트렌드가 궁금해요", pick:"국가만 선택하면 됩니다", max:0},
  category:{name:"카테고리 경향", sent:(b,cat)=>`${cat||"___"} 카테고리에서`, ex:"예: 스킨케어의 경향성이 궁금해요", pick:"카테고리 1개 선택", max:0},
};

/* ---------- 상태 ---------- */
let S = { screen:"home", step:1, scope:null, brands:[], country:"US", cat:null, channel:"amazon", period:"12m", lens:null, genPct:0 };
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(screen, patch={}){ S={...S,...patch,screen}; render(); window.scrollTo(0,0); }
function set(patch){ S={...S,...patch}; render(); }

/* ---------- 문장 조립 ---------- */
function sentence(){
  const c = S.country==="US"?"미국":"영국";
  const ch = {amazon:"아마존", ttshop:"틱톡샵", all:"전 채널"}[S.channel];
  const scope = S.scope? SCOPES[S.scope].sent(S.brands, S.cat) : '<span class="slot">누구를 볼지 고르면</span>';
  const lens = S.lens? `<span class="fill ${LENSES[S.lens].fill}">${LENSES[S.lens].name}</span>` : '<span class="slot">무엇이 궁금한지 고르면 문장이 완성됩니다</span>';
  return `<span class="fill">${c} ${ch}</span>에서, ${S.scope?`<span class="fill">${esc(typeof scope==="string"?scope:scope)}</span>`:scope} ${lens}`;
}
function sentencePlain(){
  const c = S.country==="US"?"미국":"영국"; const ch={amazon:"아마존",ttshop:"틱톡샵",all:"전 채널"}[S.channel];
  return `${c} ${ch}에서, ${S.scope?SCOPES[S.scope].sent(S.brands,S.cat):""} ${S.lens?LENSES[S.lens].name:""}`;
}

/* ---------- 렌더 ---------- */
function crumb(){
  const parts={home:"", cases:"브랜드 케이스", casenew:"신규 케이스 생성", reports:"리포트 라이브러리", builder:"신규 리포트 만들기", view:"리포트 보기"};
  $("#crumb").innerHTML = S.screen==="home" ? "" :
    `<button onclick="go('home')">← 처음으로</button> <span>/</span> <b>${parts[S.screen]||""}</b>`;
}
function render(){ crumb(); ({home,cases,casenew,reports,builder,view})[S.screen](); }

/* 홈 */
function home(){
  $("#app").innerHTML = `
  <div class="home-head">

    <ul class="sections">
      <li><b>0. 한 줄 요약</b> — 순위는 블프 당일이 아니라 2주 전에 만들어진다</li>
      <li><b>A. 케이스 A · D-14 램프업형</b> — 주간 티어 스택 차트 + 대표 영상</li>
      <li><b>B. 케이스 B · 상시 유지형</b> — 주간 티어 스택 차트 + 대표 영상</li>

      <li><b>6. 다음 시즌 운영 공식</b></li>
    </ul>
    <div class="actions"><button class="btn">HTML로 열기</button><button class="btn ghost">공유 링크 복사</button></div>
  </div>`;

/* ---------- 리포트 빌더 ---------- */
function builder(){
  const st=S.step;
  const stepNames=["대상 고르기","조건 좁히기","질문 고르기","확인·생성"];
  const stepsHtml = `<div class="steps">${stepNames.map((n,i)=>`<span class="${i+1<st?'done':i+1===st?'now':''}">${i+1}. ${n}</span>`).join("")}</div>`;
  const sentHtml = `<div class="sentence"><span class="s-label">만들 리포트</span><span class="s-text">${sentence()}</span></div>`;
  let body="";
  if(st===1) body=step1(); else if(st===2) body=step2(); else if(st===3) body=step3(); else body=step4();
  $("#app").innerHTML = sentHtml + stepsHtml + body;
}

function step1(){
  return `<div class="panel">
    <h3>무엇이 궁금한 대상인가요?</h3>
    <p class="q">비교 없이 하나만 볼 수도, 여럿을 비교할 수도, 브랜드 없이 시장 전체를 볼 수도 있습니다.</p>
    <div class="opts">
      ${Object.entries(SCOPES).map(([k,v])=>`
      <button class="opt ${S.scope===k?'on':''}" onclick="set({scope:'${k}',brands:[],cat:null})">
        <h4>${v.name}</h4><p>${v.pick}</p><div class="ex">${v.ex}</div>
      </button>`).join("")}
    </div>
    <div class="actions">
      <button class="btn primary" ${S.scope?"":"disabled"} onclick="set({step:2})">다음</button>
      <span class="hint">${S.scope? "":"대상 유형을 먼저 골라주세요"}</span>
    </div>
  </div>`;
}

function step2(){
  const needBrand = S.scope==="single"||S.scope==="compare";
  const needCat = S.scope==="category";
  const pool = BRANDS.filter(b=>b.c===S.country);
  return `<div class="panel">
    <h3>조건을 좁혀주세요</h3>
    <p class="q">국가와 세일즈 채널은 모든 리포트의 공통 조건입니다.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px">
      <div><div class="hint" style="margin-bottom:6px">국가</div><div class="chips">
        ${["US","GB"].map(c=>`<button class="chip ${S.country===c?'on':''}" onclick="set({country:'${c}',brands:[]})">${c==="US"?"미국":"영국"}</button>`).join("")}
      </div></div>
      <div><div class="hint" style="margin-bottom:6px">세일즈 채널</div><div class="chips">
        ${[["amazon","아마존"],["ttshop","틱톡샵"],["all","전 채널"]].map(([k,n])=>`<button class="chip ${S.channel===k?'on':''}" onclick="set({channel:'${k}'})">${n}</button>`).join("")}
      </div></div>
      <div><div class="hint" style="margin-bottom:6px">기간</div><div class="chips">
        ${[["3m","최근 3개월"],["12m","최근 1년"],["custom","직접 지정"]].map(([k,n])=>`<button class="chip ${S.period===k?'on':''}" onclick="set({period:'${k}'})">${n}</button>`).join("")}
      </div></div>
    </div>
    ${needBrand?`
      <div class="hint" style="margin-bottom:6px">브랜드 선택 ${S.scope==="compare"?"(2~5개)":"(1개)"} — 회색은 케이스 미적재</div>
      <div class="chips">
        ${pool.map(b=>{
          const on=S.brands.includes(b.n);
          if(!b.loaded) return `<span class="chip dis">${esc(b.n)}<span class="n">미적재</span></span>`;
          return `<button class="chip ${on?'on':''}" onclick="toggleBrand('${esc(b.n)}')">${esc(b.n)}<span class="n">${(b.vids/1000).toFixed(1)}k</span></button>`;
        }).join("")}
      </div>
      <div class="callout">여기 없는 브랜드가 궁금하면 먼저 <b>신규 케이스 생성</b>으로 적재해야 합니다 (약 1.5시간). 리포트는 적재된 데이터로만 만듭니다 — 없는 데이터를 지어내지 않습니다.</div>`
    :needCat?`
      <div class="hint" style="margin-bottom:6px">카테고리 선택</div>
      <div class="chips">${CATS.map(c=>`<button class="chip ${S.cat===c?'on':''}" onclick="set({cat:'${c}'})">${c}</button>`).join("")}</div>`
    :`<div class="callout" style="border-color:var(--ok);background:var(--ok-bg)">국가 전체 트렌드는 ${S.country==="US"?"미국":"영국"}에 적재된 브랜드 풀 전체(${pool.filter(b=>b.loaded).length}개 케이스)를 묶어서 봅니다.</div>`}
    <div class="actions">
      <button class="btn ghost" onclick="set({step:1})">이전</button>
      <button class="btn primary" ${step2ok()?"":"disabled"} onclick="set({step:3})">다음</button>
      <span class="hint">${step2ok()?"":(needBrand?(S.scope==="compare"?"브랜드를 2개 이상 골라주세요":"브랜드를 골라주세요"):needCat?"카테고리를 골라주세요":"")}</span>
    </div>
  </div>`;
}
function step2ok(){
  if(S.scope==="single") return S.brands.length===1;
  if(S.scope==="compare") return S.brands.length>=2;
  if(S.scope==="category") return !!S.cat;
  return true;
}
function toggleBrand(n){
  let b=[...S.brands];
  if(b.includes(n)) b=b.filter(x=>x!==n);
  else{ if(S.scope==="single") b=[n]; else if(b.length<SCOPES[S.scope].max) b.push(n); }
  set({brands:b});
}

function step3(){
  return `<div class="panel">
    <h3>무엇이 궁금하세요?</h3>
    <p class="q">질문 유형마다 검증된 리포트 양식이 정해져 있습니다 — 고르면 어떤 답과 섹션이 나오는지 아래에서 미리 보여드립니다.</p>
    <div class="opts" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
      ${Object.values(LENSES).map(l=>`
      <button class="opt ${l.cls} ${S.lens===l.key?'on':''}" onclick="set({lens:'${l.key}'})">
        <h4><span class="lens-mark"></span>${l.name}</h4>
        <p>이 리포트가 답하는 질문:</p>
        <ul class="sections">${l.ans.map(a=>`<li>${a}</li>`).join("")}</ul>
        <div class="ex" style="margin-top:10px"><b style="color:var(--sub)">포함 섹션</b></div>
        <ul class="sections">${l.secs.map(s=>`<li><b>·</b> ${s}</li>`).join("")}</ul>
      </button>`).join("")}
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="set({step:2})">이전</button>
      <button class="btn primary" ${S.lens?"":"disabled"} onclick="set({step:4,genPct:0})">다음</button>
    </div>
  </div>`;
}

function step4(){
  const l=LENSES[S.lens];
  const generating=S.genPct>0&&S.genPct<100, done=S.genPct>=100;
  return `<div class="panel">
    <h3>이 리포트를 만들까요?</h3>
    <dl class="recipe">
      <dt>질문</dt><dd>${esc(sentencePlain())}</dd>
      <dt>대상</dt><dd>${SCOPES[S.scope].name}${S.brands.length?` — ${S.brands.map(esc).join(", ")}`:""}${S.cat?` — ${S.cat}`:""}</dd>
      <dt>조건</dt><dd>${S.country==="US"?"미국":"영국"} · ${{amazon:"아마존",ttshop:"틱톡샵",all:"전 채널"}[S.channel]} · ${{['3m']:"최근 3개월",['12m']:"최근 1년",custom:"직접 지정"}[S.period]}</dd>
      <dt>양식</dt><dd>${l.name} — 섹션 ${l.secs.length}개</dd>
    </dl>
    <div class="cost">
      <div class="c"><div class="v">약 3분</div><div class="k">생성 시간 (적재 데이터만 사용)</div></div>
      <div class="c"><div class="v">~$1</div><div class="k">생성 비용</div></div>
      <div class="c"><div class="v">HTML</div><div class="k">결과물 — 라이브러리에 저장·공유 링크</div></div>
    </div>
    ${S.channel==="ttshop"&&!["Kundal"].some(b=>S.brands.includes(b))?`<div class="callout">선택한 브랜드에 틱톡샵 매출(Kalodata) 데이터가 없으면 해당 섹션은 "데이터 없음"으로 표시됩니다 — 지어내지 않습니다.</div>`:""}
    ${generating?`
      <div class="gen">리포트를 만들고 있습니다 — 데이터 조립 → 양식 채우기 → 검수 순서로 진행됩니다.
        <div class="bar"><i style="width:${S.genPct}%"></i></div>
        <span class="hint">${S.genPct<40?"적재 데이터에서 수치 조립 중 (비용 없음)":S.genPct<80?"양식에 서술 채우는 중":"수치 대사 검수 중"}</span>
      </div>`:""}
    ${done?`
      <div class="gen" style="border-style:solid;border-color:var(--ok);color:var(--ink)">
        <b>완성됐습니다.</b> 라이브러리에 저장됐고, 링크로 팀에 공유할 수 있습니다.
        <div class="actions"><button class="btn primary" onclick="go('view')">리포트 열기</button><button class="btn ghost" onclick="go('reports')">라이브러리로</button></div>
      </div>`:""}
    <div class="actions">
      <button class="btn ghost" onclick="set({step:3})">이전</button>
      ${!generating&&!done?`<button class="btn primary" onclick="fakeGen()">리포트 생성</button>`:""}
    </div>
  </div>`;
}
function fakeGen(){
  S.genPct=5; render();
  const t=setInterval(()=>{ S.genPct+=Math.random()*30; if(S.genPct>=100){S.genPct=100;clearInterval(t);} render(); },600);
}

/* 화면 함수 테이블 참조를 위해 전역 노출 */
window.go=go; window.set=set; window.toggleBrand=toggleBrand; window.fakeGen=fakeGen;
render();
</script>
